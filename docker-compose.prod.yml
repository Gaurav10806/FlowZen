services:
  # Database Service
  db:
    image: postgres:16-alpine
    container_name: flowzen-db
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-automation_db}
      POSTGRES_USER: ${DATABASE_USER:-automation_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-automation_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER:-automation_user} -d ${DATABASE_NAME:-automation_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Broker & Cache Service
  redis:
    image: redis:7-alpine
    container_name: flowzen-redis
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Application Server (Gunicorn + Uvicorn)
  backend:
    container_name: flowzen-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=project.settings
      - DJANGO_DEBUG=False
      - REDIS_HOST=redis
      - DATABASE_HOST=db
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - template_storage:/app/templates_storage
      - credential_storage:/app/credentials_storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "docker_healthcheck.py" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Async Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowzen-worker
    restart: always
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=project.settings
      - DJANGO_DEBUG=False
      - REDIS_HOST=redis
      - DATABASE_HOST=db
      - PYTHONUNBUFFERED=1
    command: python start_worker_safe.py
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - template_storage:/app/templates_storage
      - credential_storage:/app/credentials_storage
    depends_on:
      backend:
        condition: service_healthy

  # Celery Beat Periodic Scheduler
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowzen-beat
    restart: always
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=project.settings
      - DJANGO_DEBUG=False
      - REDIS_HOST=redis
      - DATABASE_HOST=db
    command: python start_beat_safe.py
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - template_storage:/app/templates_storage
      - credential_storage:/app/credentials_storage
    depends_on:
      - worker

volumes:
  pgdata:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local
  template_storage:
    driver: local
  credential_storage:
    driver: local

networks:
  default:
    name: flowzen-network
